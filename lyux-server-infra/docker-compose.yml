services:
  # --- Initialisation CA interne & Certificat TLS (généré hors Git) ---
  tls-init:
    image: alpine:3.20
    container_name: lyux-tls-init
    restart: "no"
    environment:
      - LYUX_DOMAIN=${LYUX_DOMAIN:-lyux.lan}
    volumes:
      - traefik_certs:/certs
    command:
      - sh
      - -ec
      - |
        if [ -f /certs/server.crt ] && [ -f /certs/server.key ] && [ -f /certs/ca.crt ]; then
          exit 0
        fi
        apk add --no-cache openssl >/dev/null
        umask 077
        openssl genrsa -out /certs/ca.key 4096
        openssl req -x509 -new -nodes -key /certs/ca.key -sha256 -days 3650 \
          -subj "/CN=LyuX Internal CA" -out /certs/ca.crt
        cat > /tmp/san.cnf <<EOF
        [req]
        distinguished_name = dn
        req_extensions = v3_req
        prompt = no
        [dn]
        CN = api.$${LYUX_DOMAIN}
        [v3_req]
        subjectAltName = DNS:api.$${LYUX_DOMAIN},DNS:*.$${LYUX_DOMAIN},DNS:$${LYUX_DOMAIN},DNS:lyux-server,DNS:localhost,IP:127.0.0.1
        EOF
        openssl genrsa -out /certs/server.key 2048
        openssl req -new -key /certs/server.key -out /tmp/server.csr -config /tmp/san.cnf
        openssl x509 -req -in /tmp/server.csr -CA /certs/ca.crt -CAkey /certs/ca.key -CAcreateserial \
          -out /certs/server.crt -days 825 -sha256 -extensions v3_req -extfile /tmp/san.cnf
        chmod 600 /certs/ca.key /certs/server.key
        chmod 644 /certs/ca.crt /certs/server.crt

  # --- Reverse Proxy Traefik ---
  traefik:
    image: traefik:v3.1
    container_name: lyux-traefik
    restart: unless-stopped
    depends_on:
      tls-init:
        condition: service_completed_successfully
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "${TRAEFIK_HTTP_PORT:-8088}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8888}:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./configs/traefik:/etc/traefik:ro"
      - "traefik_certs:/certs:ro"
    networks:
      - lyux-net

  # --- Cache Local APT (Apt-Cacher-NG) ---
  apt-cacher-ng:
    image: sameersbn/apt-cacher-ng:latest
    container_name: lyux-apt-cacher
    restart: unless-stopped
    ports:
      - "3142:3142"
    volumes:
      - apt_cache_data:/var/cache/apt-cacher-ng
    networks:
      - lyux-net

  # --- Base de données GLPI (MariaDB) ---
  glpi-db:
    image: mariadb:10.11
    container_name: lyux-glpi-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${GLPI_DB_ROOT_PASSWORD:?GLPI_DB_ROOT_PASSWORD obligatoire}
      MARIADB_DATABASE: ${GLPI_DB_NAME:-glpidb}
      MARIADB_USER: ${GLPI_DB_USER:-glpi}
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD:?GLPI_DB_PASSWORD obligatoire}
    volumes:
      - glpi_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${MARIADB_ROOT_PASSWORD} --silent || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - lyux-net

  # --- GLPI (Inventaire & Gestion des Tickets) ---
  glpi:
    image: diouxx/glpi:latest
    container_name: lyux-glpi
    restart: unless-stopped
    depends_on:
      glpi-db:
        condition: service_healthy
    ports:
      - "${GLPI_HTTP_PORT:-8085}:80"
    environment:
      TIMEZONE: Europe/Paris
      MARIADB_HOST: glpi-db
      MARIADB_PORT: 3306
      MARIADB_DATABASE: ${GLPI_DB_NAME:-glpidb}
      MARIADB_USER: ${GLPI_DB_USER:-glpi}
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD:?GLPI_DB_PASSWORD obligatoire}
    volumes:
      - glpi_data:/var/www/html/glpi
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glpi.rule=Host(`glpi.lyux.lan`)"
      - "traefik.http.routers.glpi.entrypoints=web"
      - "traefik.http.services.glpi.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lyux-net

  # --- LDAP Account Manager (LAM) ---
  ldap-account-manager:
    image: ldapaccountmanager/lam:latest
    container_name: lyux-lam
    restart: unless-stopped
    ports:
      - "${LAM_HTTP_PORT:-8082}:80"
    environment:
      - LAM_LANG=fr_FR
      - LAM_PASSWORD=${LAM_ADMIN_PASSWORD:?LAM_ADMIN_PASSWORD obligatoire}
    volumes:
      - lam_data:/var/lib/ldap-account-manager
      - ./configs/lam/config.cfg:/var/lib/ldap-account-manager/config/config.cfg
      - ./configs/lam/lyux.conf:/var/lib/ldap-account-manager/config/profiles/lyux.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lam.rule=Host(`lam.lyux.lan`)"
      - "traefik.http.routers.lam.entrypoints=web"
      - "traefik.http.services.lam.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - lyux-net

  # --- Supervision Réseau & Machines (Uptime Kuma) ---
  supervision:
    image: louislam/uptime-kuma:2
    container_name: lyux-supervision
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.supervision.rule=Host(`supervision.lyux.lan`)"
      - "traefik.http.routers.supervision.entrypoints=web"
      - "traefik.http.services.supervision.loadbalancer.server.port=3001"
    networks:
      - lyux-net

  # --- LyuX Control API (Enrôlement & Profils) ---
  lyux-api:
    build:
      context: ../lyux-server-api
      dockerfile: Dockerfile
    container_name: lyux-api
    restart: unless-stopped
    environment:
      - LYUX_ENV=production
      - LYUX_DOMAIN=${LYUX_DOMAIN:-lyux.lan}
      - GLPI_API_URL=http://glpi/apirest.php
      - GLPI_USER_TOKEN=${GLPI_USER_TOKEN:?GLPI_USER_TOKEN obligatoire}
    ports:
      - "8000:8000"
    volumes:
      - api_data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.lyux.lan`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api-https.rule=Host(`api.lyux.lan`)"
      - "traefik.http.routers.api-https.entrypoints=websecure"
      - "traefik.http.routers.api-https.tls=true"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    networks:
      - lyux-net

  # --- LyuX Hub (ancien admin panel conteneurisé) ---
  lyux-hub:
    build:
      context: ../apps
      dockerfile: hub/Dockerfile
    container_name: lyux-hub
    restart: unless-stopped
    depends_on:
      - lyux-api
    ports:
      - "${HUB_HTTP_PORT:-8086}:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hub.rule=Host(`hub.lyux.lan`)"
      - "traefik.http.routers.hub.entrypoints=web"
      - "traefik.http.services.hub.loadbalancer.server.port=80"
    networks:
      - lyux-net

  # --- LyuX Admin UI (nouvelle interface React en parallèle) ---
  lyux-admin-ui:
    build:
      context: ../apps/admin-ui
      dockerfile: Dockerfile
    container_name: lyux-admin-ui
    restart: unless-stopped
    ports:
      - "${ADMIN_UI_HTTP_PORT:-8087}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-ui.rule=Host(`admin.lyux.lan`)"
      - "traefik.http.routers.admin-ui.entrypoints=web"
      - "traefik.http.services.admin-ui.loadbalancer.server.port=80"
    networks:
      - lyux-net

  # --- Base de données Bor (PostgreSQL) ---
  bor-db:
    image: postgres:17-alpine
    container_name: lyux-bor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BOR_DB_USER:-bor}
      POSTGRES_PASSWORD: ${BOR_DB_PASSWORD:?BOR_DB_PASSWORD obligatoire}
      POSTGRES_DB: ${BOR_DB_NAME:-bor}
    volumes:
      - bor_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOR_DB_USER:-bor} -d ${BOR_DB_NAME:-bor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lyux-net

  # --- Bor GPO Server (Politiques Linux temps réel) ---
  bor-server:
    build:
      context: .
      dockerfile: Dockerfile.bor
      args:
        BOR_VERSION: ${BOR_VERSION:-0.10.1}
    container_name: lyux-bor-server
    restart: unless-stopped
    depends_on:
      bor-db:
        condition: service_healthy
    ports:
      - "${BOR_HTTP_PORT:-8089}:8443"
      - "${BOR_GRPC_PORT:-9091}:8444"
    environment:
      - GODEBUG=x509negativeserial=1,x509usefallbackroots=1
      - DB_HOST=bor-db
      - DB_PORT=5432
      - DB_USER=${BOR_DB_USER:-bor}
      - DB_PASSWORD=${BOR_DB_PASSWORD:?BOR_DB_PASSWORD obligatoire}
      - DB_NAME=${BOR_DB_NAME:-bor}
      - DB_SSLMODE=disable
      - BOR_ENROLLMENT_PORT=8443
      - BOR_POLICY_PORT=8444
      - BOR_HOSTNAMES=${BOR_HOSTNAMES:-localhost,bor.lyux.lan}
      - BOR_METRICS_ADDR=127.0.0.1:9090
    volumes:
      - bor_pki:/var/lib/bor/pki
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bor.rule=Host(`bor.lyux.lan`)"
      - "traefik.http.routers.bor.entrypoints=web"
      - "traefik.http.services.bor.loadbalancer.server.port=8443"
      - "traefik.http.services.bor.loadbalancer.server.scheme=https"
    networks:
      - lyux-net

networks:
  lyux-net:
    name: lyux-internal-network
    driver: bridge

volumes:
  traefik_certs:
  apt_cache_data:
  glpi_db_data:
  glpi_data:
  lam_data:
  uptime_kuma_data:
  api_data:
  bor_db_data:
  bor_pki:
