services:
  # --- Reverse Proxy Traefik ---
  traefik:
    image: traefik:v3.1
    container_name: lyux-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${TRAEFIK_HTTP_PORT:-8088}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8888}:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./configs/traefik:/etc/traefik"
    networks:
      - lyux-net

  # --- Cache Local APT (Apt-Cacher-NG) ---
  apt-cacher-ng:
    image: sameersbn/apt-cacher-ng:latest
    container_name: lyux-apt-cacher
    restart: unless-stopped
    ports:
      - "3142:3142"
    volumes:
      - apt_cache_data:/var/cache/apt-cacher-ng
    networks:
      - lyux-net

  # --- Base de données GLPI (MariaDB) ---
  glpi-db:
    image: mariadb:10.11
    container_name: lyux-glpi-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${GLPI_DB_ROOT_PASSWORD:-root_secret_pass}
      MARIADB_DATABASE: ${GLPI_DB_NAME:-glpidb}
      MARIADB_USER: ${GLPI_DB_USER:-glpi}
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD:-glpi_secret_pass}
    volumes:
      - glpi_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${MARIADB_ROOT_PASSWORD} --silent || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - lyux-net

  # --- GLPI (Inventaire & Gestion des Tickets) ---
  glpi:
    image: diouxx/glpi:latest
    container_name: lyux-glpi
    restart: unless-stopped
    depends_on:
      glpi-db:
        condition: service_healthy
    ports:
      - "${GLPI_HTTP_PORT:-8085}:80"
    environment:
      TIMEZONE: Europe/Paris
      MARIADB_HOST: glpi-db
      MARIADB_PORT: 3306
      MARIADB_DATABASE: ${GLPI_DB_NAME:-glpidb}
      MARIADB_USER: ${GLPI_DB_USER:-glpi}
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD:-glpi_secret_pass}
    volumes:
      - glpi_data:/var/www/html/glpi
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glpi.rule=Host(`glpi.lyux.lan`)"
      - "traefik.http.routers.glpi.entrypoints=web"
      - "traefik.http.services.glpi.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lyux-net

  # --- LDAP Account Manager (LAM) ---
  ldap-account-manager:
    image: ldapaccountmanager/lam:latest
    container_name: lyux-lam
    restart: unless-stopped
    ports:
      - "${LAM_HTTP_PORT:-8082}:80"
    environment:
      - LAM_LANG=fr_FR
      - LAM_PASSWORD=${LAM_ADMIN_PASSWORD:-admin_secret_pass}
    volumes:
      - lam_data:/var/lib/ldap-account-manager
      - ./configs/lam/config.cfg:/var/lib/ldap-account-manager/config/config.cfg
      - ./configs/lam/lyux.conf:/var/lib/ldap-account-manager/config/profiles/lyux.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lam.rule=Host(`lam.lyux.lan`)"
      - "traefik.http.routers.lam.entrypoints=web"
      - "traefik.http.services.lam.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - lyux-net

  # --- Supervision Réseau & Machines (Uptime Kuma) ---
  supervision:
    image: louislam/uptime-kuma:1
    container_name: lyux-supervision
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.supervision.rule=Host(`supervision.lyux.lan`)"
      - "traefik.http.routers.supervision.entrypoints=web"
      - "traefik.http.services.supervision.loadbalancer.server.port=3001"
    networks:
      - lyux-net

  # --- LyuX Control API (Enrôlement & Profils) ---
  lyux-api:
    build:
      context: ../lyux-server-api
      dockerfile: Dockerfile
    container_name: lyux-api
    restart: unless-stopped
    environment:
      - LYUX_ENV=production
      - LYUX_DOMAIN=${LYUX_DOMAIN:-lyux.lan}
      - GLPI_API_URL=http://glpi/apirest.php
      - GLPI_USER_TOKEN=${GLPI_USER_TOKEN:-default_token}
    ports:
      - "8000:8000"
    volumes:
      - api_data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.lyux.lan`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    networks:
      - lyux-net

networks:
  lyux-net:
    name: lyux-internal-network
    driver: bridge

volumes:
  apt_cache_data:
  glpi_db_data:
  glpi_data:
  lam_data:
  uptime_kuma_data:
  api_data:
