# ==============================================================================
# Profil de Domaine LAM LyuX - Opération Manchot
# Emplacement cible : projects/lyux-server-infra/configs/lam/lyux.conf
# Conteneur LAM : /var/lib/ldap-account-manager/config/profiles/lyux.conf
# ==============================================================================

# Paramètres de connexion au serveur d'annuaire Samba-AD DC
# Note: depuis le conteneur Docker, 'localhost' ou 'host.docker.internal' ou l'IP de passerelle
serverURL: ldap://host.docker.internal:389
admins: cn=Administrator,cn=Users,dc=lyux,dc=lan
trees: dc=lyux,dc=lan
PasswdCrypto: SSHA

# Types de comptes actifs dans l'interface
activeTypes: user,group

# ==============================================================================
# CONFIGURATION DES COMPTES UTILISATEURS (Élèves, Enseignants, Vie-Sco, Direction)
# ==============================================================================

types: suffix_user: ou=utilisateurs,dc=lyux,dc=lan
types: attr_user: #sAMAccountName;#givenName;#sn;#mail;#telephoneNumber;#userPassword
types: modules_user: inetOrgPerson,posixAccount,shadowAccount,sambaSamAccount,windowsUser

# Sous-arborescences et OUs de rangement
types: subtrees_user: ou=eleves,ou=utilisateurs,dc=lyux,dc=lan;ou=enseignants,ou=utilisateurs,dc=lyux,dc=lan;ou=viesco,ou=utilisateurs,dc=lyux,dc=lan;ou=direction,ou=utilisateurs,dc=lyux,dc=lan

# ==============================================================================
# CONFIGURATION DES GROUPES (Groupes de Sécurité & Pédagogiques)
# ==============================================================================

types: suffix_group: ou=groupes,dc=lyux,dc=lan
types: attr_group: #cn;#gidNumber;#memberUID;#description
types: modules_group: posixGroup,sambaGroupMapping,windowsGroup

# ==============================================================================
# OUTILS ET MODULES INTÉGRÉS
# ==============================================================================

tools: tool_treeView: dc=lyux,dc=lan
tools: tool_schemaBrowser: true
tools: tool_tests: true
tools: tool_upload: true

# Préférences régionales & Thème
language: fr_FR
theme: default
script_path: /var/lib/ldap-account-manager
