[global]
   workgroup = LYUX
   server string = LyuX NAS Server
   server role = standalone server
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   map to guest = bad user

[homes]
   comment = Dossiers personnels permanents LyuX
   path = /srv/samba/homes/%S
   browseable = no
   read only = no
   create mask = 0700
   directory mask = 0700
   valid users = %S

[classes]
   comment = Partages pedagogiques par annee et classe
   path = /srv/samba/classes
   browseable = yes
   read only = no

[commun]
   comment = Ressources etablissement
   path = /srv/samba/commun
   browseable = yes
   read only = no
