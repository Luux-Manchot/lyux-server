[WebService]
# Origines autorisées pour les connexions WebSockets (protection anti-CSRF)
Origins = https://server.lyux.lan:9090 https://lyux-server.lyux.lan:9090 https://localhost:9090 https://127.0.0.1:9090
# En-têtes pour compatibilité reverse-proxy si requis
ProtocolHeader = X-Forwarded-Proto
ForwardedForHeader = X-Forwarded-For
# Nombre maximal de connexions en attente
MaxStartups = 10

[Session]
# Bannière institutionnelle affichée sur l'écran d'authentification
Banner = /etc/issue.cockpit
# Déconnexion automatique après inactivité (15 minutes)
IdleTimeout = 15
